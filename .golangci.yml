version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      # WebSocket 清理性 Close（带状态码参数，签名不符 io.Closer 故不在内置豁免内）等同 io.Closer.Close 处理。
      exclude-functions:
        - (*github.com/coder/websocket.Conn).Close
    staticcheck:
      checks:
        - SA*
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
